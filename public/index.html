    <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Audio Helpers ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('click', initAudio, { once: true });
    document.addEventListener('touchstart', initAudio, { once: true });

    function playSound(type) {
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      if (type === 'success') {
        const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.setValueAtTime(659.25, now); osc1.connect(gain); osc1.start(now); osc1.stop(now + 0.4);
        const osc2 = audioCtx.createOscillator(); osc2.type = 'sine'; osc2.frequency.setValueAtTime(523.25, now + 0.3); osc2.connect(gain); osc2.start(now + 0.3); osc2.stop(now + 1.0);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.6); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
      } else if (type === 'error') {
        const osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.connect(gain);
        gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'delete') {
        const osc = audioCtx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2); osc.connect(gain);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
      }
    }

    // --- Helpers ---
    function getTodayString() {
      const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0];
    }

    function getSafeDate(item, field) {
        const val = item[field];
        if (!val) {
            if (item.processDate) return item.processDate.substring(0, 10);
            if (item.timestamp && item.timestamp.seconds) return new Date(item.timestamp.seconds * 1000).toISOString().substring(0,10);
            return getTodayString();
        }
        if (typeof val === 'string') return val.substring(0, 10);
        if (val.seconds) return new Date(val.seconds * 1000).toISOString().substring(0, 10);
        return getTodayString();
    }

    function formatTime(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return "오류";
      return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }

    function getExpirationDate(packingDateStr, storageType) {
        if(!packingDateStr) return null;
        const d = new Date(packingDateStr);
        if (isNaN(d.getTime())) return null;
        const daysToAdd = storageType === "냉장" ? 179 : 719;
        d.setDate(d.getDate() + daysToAdd);
        return d.toISOString().split('T')[0];
    }

    // getExpirationDate의 역함수: 소비기한에서 보관일수를 빼 생산일(제조일자)을 역산
    // 수입 GS1 바코드는 생산일 없이 소비기한만 담고 있어, 이 값을 제조일자로 등록하면 유통기한 자동계산이 원래 소비기한과 일치함
    function getProductionDateFromExpiry(expiryStr, storageType) {
        if(!expiryStr) return null;
        const d = new Date(expiryStr);
        if (isNaN(d.getTime())) return null;
        const daysToSub = storageType === "냉장" ? 179 : 719;
        d.setDate(d.getDate() - daysToSub);
        return d.toISOString().split('T')[0];
    }

    // 다양한 날짜 표기를 YYYY-MM-DD로 정규화 (<input type="date">는 ISO만 허용)
    // 지원: 2026-02-06 / 2026.02.06 / 2026/2/6 / 26.02.06 / 20260206 / 260206 / "2026년 2월 6일" / EU "06.03.2025"
    function normalizeDateToISO(input) {
        if (input === null || input === undefined) return "";
        let s = String(input).trim();
        if (!s) return "";
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
        m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
        if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
        m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        m = s.match(/^(\d{2})(\d{2})(\d{2})$/);
        if (m) return `20${m[1]}-${m[2]}-${m[3]}`;
        const parts = s.split(/[.\/\-\s]+/).filter(Boolean);
        if (parts.length === 3) {
            let y, mo, da;
            if (parts[0].length === 4) { y = parts[0]; mo = parts[1]; da = parts[2]; }         // YYYY.MM.DD
            else if (parts[2].length === 4) { y = parts[2]; mo = parts[1]; da = parts[0]; }     // DD.MM.YYYY (EU)
            else { y = "20" + parts[0].padStart(2,'0'); mo = parts[1]; da = parts[2]; }          // YY.MM.DD
            const moN = parseInt(mo,10), daN = parseInt(da,10);
            if (moN >= 1 && moN <= 12 && daN >= 1 && daN <= 31)
                return `${y}-${String(moN).padStart(2,'0')}-${String(daN).padStart(2,'0')}`;
        }
        const d = new Date(s);
        if (!isNaN(d.getTime())) { d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0]; }
        return "";
    }

    // 중량 문자열 → kg 숫자. 유럽식 소수 콤마("22,890 Kg" = 22.890) 처리
    function parseWeight(input) {
        if (input === null || input === undefined) return 0;
        let s = String(input).trim().replace(/[^0-9.,]/g, '');
        if (!s) return 0;
        const hasComma = s.indexOf(',') > -1, hasDot = s.indexOf('.') > -1;
        if (hasComma && hasDot) s = s.replace(/,/g, '');       // 둘 다: 콤마=천단위 → 제거
        else if (hasComma) s = s.replace(/,/g, '.');           // 콤마만: 유럽식 소수점 → 점
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
    }

    // GS1 GTIN 국가코드 → 원산지(나라별). 14자리면 포장지시자 제외한 뒤 13자리의 앞 3자리 사용
    function originFromGtin(gtin) {
        if (!gtin) return "";
        const g = String(gtin).replace(/\D/g, '');
        if (g.length < 8) return "";
        const g13 = g.length >= 14 ? g.slice(-13) : g;
        const p = parseInt(g13.substr(0, 3), 10);
        if (isNaN(p)) return "";
        if (p === 880) return "국내산";
        if (p >= 0 && p <= 139) return "미국산";
        if (p >= 754 && p <= 755) return "캐나다산";
        if (p >= 930 && p <= 939) return "호주산";
        if (p >= 940 && p <= 949) return "뉴질랜드산";
        if (p >= 840 && p <= 849) return "스페인산";
        if (p >= 570 && p <= 579) return "덴마크산";
        if (p >= 400 && p <= 440) return "독일산";
        if (p >= 870 && p <= 879) return "네덜란드산";
        if (p >= 300 && p <= 379) return "프랑스산";
        if (p >= 900 && p <= 919) return "오스트리아산";
        if (p >= 540 && p <= 549) return "벨기에산";
        if (p === 539) return "아일랜드산";
        if (p === 590) return "폴란드산";
        if (p === 599) return "헝가리산";
        if (p >= 800 && p <= 839) return "이탈리아산";
        if (p === 780) return "칠레산";
        if (p >= 789 && p <= 790) return "브라질산";
        if (p === 750) return "멕시코산";
        return "";
    }

    function getDDayString(expDateStr, storageType) {
        if(!expDateStr) return { text: "", status: 'normal' };
        const today = new Date(); today.setHours(0,0,0,0);
        const exp = new Date(expDateStr);
        if (isNaN(exp.getTime())) return { text: "(날짜 오류)", status: 'normal' };
        const diffTime = exp - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const warningThreshold = storageType === "냉장" ? 15 : 90;
        if (diffDays < 0) return { text: `(만료! ${Math.abs(diffDays)}일 지남)`, status: 'expired' };
        if (diffDays === 0) return { text: "(오늘 만료)", status: 'expired' };
        if (diffDays <= warningThreshold) return { text: `(D-${diffDays} 임박)`, status: 'warning' };
        return { text: `(D-${diffDays})`, status: 'normal' };
    }

    function checkExpirationWarning(expDateStr, storageType) {
        if(!expDateStr) return false;
        const today = new Date();
        const exp = new Date(expDateStr);
        if (isNaN(exp.getTime())) return false;
        const diffTime = exp - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const warningThreshold = storageType === "냉장" ? 15 : 90;
        return diffDays <= warningThreshold;
    }

    function cleanPayload(obj) {
      const newObj = {};
      Object.keys(obj).forEach(key => { if (obj[key] !== undefined && obj[key] !== null && key !== 'id') { newObj[key] = obj[key]; } });
      return newObj;
    }

    // 입고 당시의 '원래 중량'을 복원 (현재중량 + 차감합계 - 복구합계).
    // 강제소진/생산차감으로 현재 weight가 줄어도 통계상 입고량은 정확히 집계되도록 함.
    function getOriginalInboundWeight(item) {
      let w = parseFloat(item.weight) || 0;
      if (Array.isArray(item.history)) {
        item.history.forEach(h => {
          if (h.type === "CONSUME" || h.type === "PARTIAL_CONSUME") w += parseFloat(h.deductedWeight) || 0;
          else if (h.type === "RESTORE") w -= parseFloat(h.restoredWeight) || 0;
        });
      }
      return w;
    }

    const DEFAULT_MASTER_DATA = {

      grades: ['등급외', '1++', '1+', '1등급', '2등급', '3등급', 'Prime', 'Choice', 'S', 'A'],

    const BRAND_ORIGIN_MAP = {
        'TEYS': '호주산', 'AMH': '호주산', 'KILCOY': '호주산', 'OAKEY': '호주산', 'WMPG': '호주산',

        'DANISH CROWN': '덴마크산', 'TICAN': '덴마크산', 'TONNIES': '독일산', 'TÖNNIES': '독일산', 'VION': '네덜란드산',
        '횡성축협': '국내산', '도드람': '국내산', '목우촌': '국내산', '한돈': '국내산', '하이포크': '국내산'
    };

    const AI_MODEL = "gemini-2.5-flash";

    function getApiKey() { return localStorage.getItem("meat_wms_api_key") || ""; }

    async function callGeminiVision(base64Image) {
      const apiKey = getApiKey();
      if (!apiKey) return { error: "설정 탭에서 API 키를 먼저 등록해주세요." };
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ role: "user", parts: [
            { text: `You are extracting fields from a Korean or European meat (pork/beef) box label. Return ONLY a valid JSON object (no markdown) with keys: productName, weight, packingDate, origin, grade, factoryNo, brand, supplier, lotNumber, barcode.
- packingDate = the MANUFACTURING / PRODUCTION date. On Korean labels this is "제조일자" or "생산일". On imported labels use "Packing date" or "Freezing / Packing date" (if absent, "Slaughtering date"). Korean labels ALSO print "소비기한" or "유통기한" (use-by / expiry) — DO NOT return that; return the 제조일자 only. Never return an expiry/best-before date. Output packingDate strictly as YYYY-MM-DD.
- weight = NET weight in kilograms as a plain decimal using a dot (e.g. 22.890). If the label uses a comma as the decimal separator (e.g. "22,890 Kg" means 22.890), convert it. Prefer Net weight over Gross weight. Digits only with one dot.
- origin = country of origin printed on the label, in Korean form ending with "산" (e.g. 국내산, 스페인산, 덴마크산, 독일산, 네덜란드산, 미국산, 호주산).
- barcode = the numeric human-readable string printed under the barcode, if visible.
Use an empty string "" for any field you cannot read.` },
            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
          ] }],
        generationConfig: { response_mime_type: "application/json" }
      };
      try {
        const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
        const data = await res.json();
        if(data.error) throw new Error(data.error.message);
        let text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("분석 결과가 없습니다.");
        const jsonStart = text.indexOf('{'); const jsonEnd = text.lastIndexOf('}');
        if (jsonStart === -1 || jsonEnd === -1) throw new Error("JSON 파싱 실패");
        const parsed = JSON.parse(text.substring(jsonStart, jsonEnd + 1));
        if(parsed.weight !== undefined && parsed.weight !== null && parsed.weight !== "") parsed.weight = parseWeight(parsed.weight);
        if(parsed.packingDate) parsed.packingDate = normalizeDateToISO(parsed.packingDate);
        return parsed;
      } catch (e) { return { error: e.message }; }
    }

    async function callGeminiText(prompt) {
      const apiKey = getApiKey();
      if (!apiKey) return "오류: 설정 탭에서 API 키를 등록해주세요.";
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${apiKey}`;
      try {
        const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
        const data = await res.json();
        if(data.error) return "오류: " + data.error.message;
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || "분석 실패";

    // --- 1.5 Production Screen ---
    function ProductionScreen({ user, masterData, globalSettings, inventory, productionLogs }) {
        const [prodName, setProdName] = useState("");

        const [packWeight, setPackWeight] = useState("");

        // 파지를 원육으로 쓸 땐 파지 재생성 비활성화

                return `${shortName} 큐브(파지)`;

        useEffect(() => {

                if (matchedPreset) {
                    setDripLossPercent(matchedPreset.dripLoss !== undefined ? String(matchedPreset.dripLoss) : "");
                    setScrapLossPercent(matchedPreset.scrapLoss !== undefined ? String(matchedPreset.scrapLoss) : "");
                    setWasteLossPercent(matchedPreset.wasteLoss !== undefined ? String(matchedPreset.wasteLoss) : "");
                }
            }
        }, [prodName, cutType, lossPresetsKey]);

        // UX 개선: 비활성 -> 활성 전환 시에만 한 번 켜주고, 수동 설정 유지
        const prevEligibleRef = useRef(false);

            if (isScrapEligible && !prevEligibleRef.current) {
                setSaveScrap(true);

                setSaveScrap(false);
            }
            prevEligibleRef.current = isScrapEligible;
        }, [isScrapEligible]);

        const dailyLogs = useMemo(() => {
            return productionLogs.filter(log => log.processDate === globalSettings.workDate);
        }, [productionLogs, globalSettings.workDate]);

        const availableStock = useMemo(() => {
            if (!prodName) return 0;
            const stock = inventory.filter(i => i.status === "ACTIVE" && i.location === targetLocation && i.productName === prodName);
            return stock.reduce((sum, item) => sum + (parseFloat(item.weight) || 0), 0);
        }, [inventory, targetLocation, prodName]);

        const calculatedTotalProdWeight = useMemo(() => {
            const w = parseFloat(packWeight) || 0;
            const c = parseInt(packCount) || 0;
            const multiplier = packUnit === "g" ? 0.001 : 1;
            return w * multiplier * c;
        }, [packWeight, packUnit, packCount]);

        const { totalDeduction, dripLossWeight, scrapLossWeight, wasteLossWeight, totalLossPct } = useMemo(() => {
            const prodW = calculatedTotalProdWeight;
            const dLossPct = parseFloat(dripLossPercent) || 0;
            const sLossPct = parseFloat(scrapLossPercent) || 0;
            const wLossPct = parseFloat(wasteLossPercent) || 0;
            const tLossPct = dLossPct + sLossPct + wLossPct;

            let totalDed = prodW;
            let dLossW = 0, sLossW = 0, wLossW = 0;

            if (prodW > 0 && tLossPct < 100) {
                totalDed = prodW / (1 - (tLossPct / 100));
                dLossW = totalDed * (dLossPct / 100);
                sLossW = totalDed * (sLossPct / 100);
                wLossW = totalDed * (wLossPct / 100);
            }
            return { totalDeduction: totalDed, dripLossWeight: dLossW, scrapLossWeight: sLossW, wasteLossWeight: wLossW, totalLossPct: tLossPct };
        }, [calculatedTotalProdWeight, dripLossPercent, scrapLossPercent, wasteLossPercent]);

        const handleProductionSubmit = async () => {
            if (!prodName || !cutType || !packWeight || !packCount) {
                setFeedback({ type: "error", msg: "품목, 컷팅형태, 팩중량, 수량을 모두 입력하세요." });

                setTimeout(() => setFeedback(null), 3000);

            if (calculatedTotalProdWeight <= 0) {
                setFeedback({ type: "error", msg: "올바른 중량 및 수량을 입력하세요." });
                return;
            }

            if (totalDeduction > availableStock) {
                setFeedback({ type: "error", msg: `선택 위치(${targetLocation})에 가용 재고가 부족합니다. (필요: ${totalDeduction.toFixed(2)}kg / 현재: ${availableStock.toFixed(2)}kg)` });
                playSound("error");
                setTimeout(() => setFeedback(null), 4000);
                return;
            }

            const targetStock = inventory.filter(i => i.status === "ACTIVE" && i.location === targetLocation && i.productName === prodName)
                                         .sort((a, b) => new Date(a.inboundDate || a.clientTimestamp) - new Date(b.inboundDate || b.clientTimestamp));

            if (targetStock.length > 400) {
                setFeedback({ type: "error", msg: "차감 대상 재고가 너무 많아(400개 초과) 오류가 발생할 수 있습니다." });
                playSound("error");
                setTimeout(() => setFeedback(null), 4000);
                return;
            }

            if (!user) return;
            const { db, writeBatch, doc, collection, arrayUnion, serverTimestamp } = window.__fb;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const batch = writeBatch(db);
            const nowISO = new Date().toISOString();

            try {
                let remainingToDeduct = totalDeduction;
                let usedItemRefs = [];
                let usedStocksData = [];

                for (const item of targetStock) {
                    if (remainingToDeduct <= 0) break;
                    const itemRef = doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", item.id);
                    const currentItemWeight = parseFloat(item.weight) || 0;
                    usedItemRefs.push(item.barcode || item.lotNumber || "수동입고건");

                    let deducted = 0;
                    if (currentItemWeight <= remainingToDeduct) {
                        deducted = currentItemWeight;
                        remainingToDeduct -= currentItemWeight;
                        batch.update(itemRef, {
                            status: "CONSUMED", weight: 0, consumedAt: nowISO,
                            history: arrayUnion({ type: "CONSUME", date: nowISO, deductedWeight: deducted, workDate: globalSettings.workDate, note: `생산 투입 (${cutType})` })
                        });
                    } else {
                        deducted = remainingToDeduct;
                        batch.update(itemRef, {
                            weight: currentItemWeight - remainingToDeduct,
                            history: arrayUnion({ type: "PARTIAL_CONSUME", date: nowISO, deductedWeight: deducted, workDate: globalSettings.workDate, note: `생산 부분투입 (${cutType})` })
                        });
                        remainingToDeduct = 0;
                    }
                    usedStocksData.push({ id: item.id, deductedWeight: deducted });
                }

                let createdScrapId = null;
                if (saveScrap && scrapLossWeight > 0) {
                    const scrapRef = doc(collection(db, "artifacts", appId, "public", "data", "meat_wms_logs"));
                    createdScrapId = scrapRef.id;

                        productName: derivedScrapName,
                        weight: scrapLossWeight, status: "ACTIVE", initialType: "INBOUND", transactionType: "INBOUND",
                        location: targetLocation, storageType: "냉장", inboundDate: globalSettings.workDate, processDate: globalSettings.workDate,
                        clientTimestamp: nowISO, inboundAt: nowISO, history: [{ type: "INBOUND", date: nowISO, workDate: globalSettings.workDate, location: targetLocation }],
                        userNote: `[${prodName}] 파지 로스에서 전환됨`, traceabilityNo: `원본: ${usedItemRefs[0] || '알수없음'}`, timestamp: serverTimestamp()
                    });

                const prodLogRef = doc(collection(db, "artifacts", appId, "public", "data", "meat_production_logs"));

                });

                                history: arrayUnion({ type: "RESTORE", date: nowISO, restoredWeight: stock.deductedWeight, workDate: globalSettings.workDate, note: "생산 취소로 인한 복구" })

    // --- 1. Scan Screen ---
    function ScanScreen({ user, masterData, globalSettings, setGlobalSettings, inventory }) {
      const [inputBarcode, setInputBarcode] = useState("");
      const [mode, setMode] = useState("INBOUND");
      const [isContinuous, setIsContinuous] = useState(true);
      const [lastLog, setLastLog] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalData, setModalData] = useState({});
      const inputRef = useRef(null);
      const fileInputRef = useRef(null);

      const commitTransaction = async (data) => {
        if (!user) return;
        const { db, addDoc, collection, serverTimestamp, updateDoc, doc, arrayUnion } = window.__fb;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        try {
          const safeData = cleanPayload(data);
          const currentWorkDate = globalSettings.workDate;
          const nowISO = new Date().toISOString();

          if (mode === "INBOUND") {
             const duplicate = safeData.barcode && inventory.find(i => i.status === "ACTIVE" && i.barcode === safeData.barcode && i.transactionType !== "RETURN");
             if(duplicate && !safeData.id) {
                setFeedback({ type: "error", msg: "🚨 이미 등록된 바코드입니다!" }); playSound("error"); setTimeout(() => setFeedback(null), 3000); return;
             }
             await addDoc(collection(db, "artifacts", appId, "public", "data", "meat_wms_logs"), {
               ...safeData, status: "ACTIVE", initialType: "INBOUND",
               history: [{ type: "INBOUND", date: nowISO, workDate: currentWorkDate, location: safeData.location }],
               clientTimestamp: nowISO, processDate: currentWorkDate, inboundDate: currentWorkDate, inboundAt: nowISO, timestamp: serverTimestamp()
             });
             setLastLog(safeData); setFeedback({ type: "success", msg: "입고 등록 완료" }); playSound("success");
          } else if (mode === "MOVE") {
             let target = safeData.id ? inventory.find(i => i.id === safeData.id) : inventory.find(i => i.status === "ACTIVE" && i.barcode === safeData.barcode);
             if (target) {
               if (target.location === safeData.location) { setFeedback({ type: "error", msg: "⚠️ 이미 해당 위치에 있습니다." }); playSound("error"); setTimeout(() => setFeedback(null), 3000); return; }
               await updateDoc(doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", target.id), {
                 location: safeData.location, transactionType: "MOVE", lastMovedAt: nowISO, processDate: currentWorkDate, moveDate: currentWorkDate,
                 history: arrayUnion({ type: "MOVE", date: nowISO, workDate: currentWorkDate, from: target.location, to: safeData.location })
               });
               setLastLog({ ...target, location: safeData.location, transactionType: "MOVE", prevLoc: target.location });
               setFeedback({ type: "success", msg: "이동 완료" }); playSound("success");
             } else { setFeedback({ type: "error", msg: "재고 없음" }); playSound("error"); setTimeout(() => setFeedback(null), 3000); return; }
          } else if (mode === "RETURN") {
             let target = safeData.id ? inventory.find(i => i.id === safeData.id) : inventory.find(i => i.status === "ACTIVE" && i.barcode === safeData.barcode);
             if (target) {
                if (target.status === "RETURNED") { setFeedback({ type: "error", msg: "🚨 이미 반품된 상품입니다." }); playSound("error"); setTimeout(() => setFeedback(null), 3000); return; }
                const returnDest = safeData.location || "반품";
                await updateDoc(doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", target.id), {
                   location: returnDest, status: "RETURNED", transactionType: "RETURN", returnedAt: nowISO, processDate: currentWorkDate, returnDate: currentWorkDate,
                   history: arrayUnion({ type: "RETURN", date: nowISO, workDate: currentWorkDate, from: target.location, to: returnDest })
                });
                setLastLog({ ...target, location: returnDest, transactionType: "RETURN" }); setFeedback({ type: "success", msg: "반품 처리 완료" }); playSound("success");
             } else { setFeedback({ type: "error", msg: "재고 없음" }); playSound("error"); setTimeout(() => setFeedback(null), 3000); return; }
          }
          setTimeout(() => setFeedback(null), 1500);
        } catch(e) { console.error(e); setFeedback({type:"error", msg: "오류: " + e.message}); playSound("error"); }
      };

      // 바코드 파서: (a) GS1-128 AI 파싱, (b) 국내산 농협 고정형(23자리), (c) 순수 GTIN
      // res.dateIsExpiry=true 이면 date가 소비기한(생산일 역산 필요), false 이면 생산일/제조일자
      const parseBarcode = (raw) => {
        let res = { gtin:"", weight:0, date:null, dateIsExpiry:false, lot:"", origin:"" };
        if (!raw) return res;
        let s = String(raw).trim().replace(/^\][A-Za-z]\d/, ""); // 앞 AIM 심볼로지 식별자(]C1 등) 제거
        const GS = String.fromCharCode(29); // FNC1 구분자
        const isGs1 = s.indexOf("(") > -1 || s.indexOf(GS) > -1 || /^(01|02)\d/.test(s);

        const setDate = (val6, isExpiry) => {
          if (!/^\d{6}$/.test(val6)) return;
          const y = parseInt(val6.substr(0,2),10), mo = parseInt(val6.substr(2,2),10), da = parseInt(val6.substr(4,2),10);
          if (y < 20 || y > 49 || mo < 1 || mo > 12 || da < 1 || da > 31) return;
          if (isExpiry && res.date && !res.dateIsExpiry) return; // 생산일이 이미 있으면 소비기한으로 덮지 않음
          res.date = `20${val6.substr(0,2)}-${val6.substr(2,2)}-${val6.substr(4,2)}`;
          res.dateIsExpiry = !!isExpiry;
        };
        const applyAI = (ai, val) => {
          if (ai === "01" || ai === "02") { if(!res.gtin) res.gtin = val.replace(/\D/g,"").substr(0,14); }
          else if (ai.length === 4 && ai.substr(0,3) === "310") { const dec = parseInt(ai[3],10); const n = parseInt(val,10); if(!isNaN(n)) res.weight = n / Math.pow(10, dec); } // 순중량 kg
          else if (ai === "11" || ai === "13") setDate((val||"").substr(0,6), false); // 생산/포장일
          else if (ai === "15" || ai === "17") setDate((val||"").substr(0,6), true);  // 소비기한/만료일
          else if (ai === "10") res.lot = val;
          else if (ai === "21" && !res.lot) res.lot = val;
        };

        if (isGs1) {
          if (s.indexOf("(") > -1) {
            const re = /\((\d{2,4})\)([^(]*)/g; let m;
            while ((m = re.exec(s)) !== null) applyAI(m[1], m[2].replace(/[^0-9A-Za-z]/g,""));
          } else {
            const FIXED = {"00":18,"01":14,"02":14,"11":6,"12":6,"13":6,"15":6,"16":6,"17":6,"20":2};
            let i = 0; const L = s.length; let guard = 0;
            while (i < L && guard++ < 50) {
              if (s[i] === GS) { i++; continue; }
              let ai, dataLen, variable = false;
              if (/^3[1-6]$/.test(s.substr(i,2)) && /^\d$/.test(s[i+2]||"") && /^\d$/.test(s[i+3]||"")) { ai = s.substr(i,4); dataLen = 6; i += 4; }
              else { ai = s.substr(i,2); i += 2; if (ai in FIXED) dataLen = FIXED[ai]; else variable = true; }
              let val;
              if (variable) { let g = s.indexOf(GS, i); if (g === -1) g = L; val = s.substring(i, g); i = g; }
              else { val = s.substr(i, dataLen); i += dataLen; }
              applyAI(ai, val);
            }
          }
          if (res.gtin) res.origin = originFromGtin(res.gtin);
          return res;
        }

        // 국내산 농협 고정형: 전부 숫자, 길이 20~24, 앞6=YYMMDD(제조일자), 뒤3=중량×10, 7~10=순번
        if (/^\d{20,24}$/.test(s)) {
          const d6 = s.substr(0,6);
          const y = parseInt(d6.substr(0,2),10), mo = parseInt(d6.substr(2,2),10), da = parseInt(d6.substr(4,2),10);
          const w3 = parseInt(s.substr(-3),10);
          if (y >= 20 && y <= 49 && mo >= 1 && mo <= 12 && da >= 1 && da <= 31 && !isNaN(w3) && w3 > 0 && w3 < 1000) {
            res.date = `20${d6.substr(0,2)}-${d6.substr(2,2)}-${d6.substr(4,2)}`;
            res.weight = w3 / 10;
            res.lot = s.substr(6,4); // 순번
            return res;
          }
        }

        // 순수 GTIN(13~14자리) → 원산지만
        if (/^\d{13,14}$/.test(s)) { res.gtin = s; res.origin = originFromGtin(s); }
        return res;
      };

      const handleScan = async (e) => {

    // --- 2. History Screen ---
    function HistoryScreen({ user, inventory, masterData }) {

         if(range === 'today') { /* no op */ } else if(range === '3d') start.setDate(end.getDate() - 3); else if(range === '7d') start.setDate(end.getDate() - 7); else if(range === 'month') start.setMonth(end.getMonth() - 1); else if(range === 'thisMonth') start.setDate(1);
         const fmt = d => d.toISOString().split('T')[0];

      const logs = useMemo(() => {

         if (locFilter !== "ALL") filtered = filtered.filter(l => l.location === locFilter);

      }, [inventory, startDate, endDate, filterType, locFilter, prodFilter]);

      const summaryStats = useMemo(() => {
         return logs.reduce((acc, curr) => {

             else acc.consumedCount += 1;

         }, { totalCount: 0, activeCount: 0, consumedCount: 0, weight: 0 });
      }, [logs]);

      const stockByLoc = useMemo(() => {
         const validItems = inventory.filter(i => {
             const iDate = getSafeDate(i, 'inboundDate');

             return false;
         });
         const locs = {};
         validItems.forEach(i => {
            let loc = i.location || "미지정";

            locs[loc].items[pName].w += w;
            if (w > 0) locs[loc].items[pName].c += 1;

         });

      }, [inventory, stockDate]);

      const toggleSelection = (id) => { const s = new Set(selectedIds); s.has(id) ? s.delete(id) : s.add(id); setSelectedIds(s); };

      const updateField = async (id, field, value) => {
        try {
           const { db, updateDoc, doc } = window.__fb; const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        } catch(e) { console.error(e); }
      };

      const handleFullUpdate = async (updatedData) => {
         try {
            const { db, updateDoc, doc } = window.__fb; const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const payload = cleanPayload(updatedData);
            const original = logs.find(l => l.id === updatedData.id);
            if (original && original.history && Array.isArray(original.history)) {
                let updatedHistory = original.history.map(h => ({...h}));

                    if (updatedHistory[0].type === "INBOUND") {

                        updatedHistory[0].workDate = payload.inboundDate;

                }

                    let lastMoveIdx = -1;
                    for (let i = updatedHistory.length - 1; i >= 0; i--) {
                        if (updatedHistory[i].type === "MOVE") { lastMoveIdx = i; break; }
                    }
                    if (lastMoveIdx !== -1) {
                        const oldTime = updatedHistory[lastMoveIdx].date && updatedHistory[lastMoveIdx].date.length > 10 ? updatedHistory[lastMoveIdx].date.substring(10) : "T00:00:00.000Z";
                        updatedHistory[lastMoveIdx].date = payload.moveDate + oldTime;
                        updatedHistory[lastMoveIdx].workDate = payload.moveDate;
                    }
                }

                payload.history = updatedHistory;
            }

            setEditingItem(null);
         } catch(e) { alert("수정 실패: " + e.message); }
      };

      const executeDelete = async () => {

      const executeBulkAction = async () => {
         if (!bulkActionTarget) return;
         const { db, writeBatch, doc, arrayUnion } = window.__fb;
         const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
         const batch = writeBatch(db);

         try {
            if (bulkActionTarget === "DELETE") {
               Array.from(selectedIds).forEach(id => {
                  batch.delete(doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", id));
               });
               await batch.commit();
               playSound("delete");
            } else if (bulkActionTarget === "CONSUME") {
               Array.from(selectedIds).forEach(id => {
                  const itemRef = doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", id);
                  const original = logs.find(l => l.id === id);
                  const currentWeight = parseFloat(original.weight) || 0;
                  if (currentWeight > 0) {
                     batch.update(itemRef, {
                        status: "CONSUMED",
                        weight: 0,
                        consumedAt: new Date().toISOString(),
                        history: arrayUnion({
                           type: "CONSUME",
                           date: new Date().toISOString(),
                           deductedWeight: currentWeight,
                           workDate: getTodayString(),
                           note: "과거 누적 재고 강제 정리"
                        })
                     });
                  }
               });
               await batch.commit();
               playSound("success");
            } else if (bulkActionTarget === "RESTORE") {
               Array.from(selectedIds).forEach(id => {
                  const itemRef = doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", id);
                  const original = logs.find(l => l.id === id);
                  if (original.status === "CONSUMED") {
                     const consumeEvent = [...(original.history || [])].reverse().find(h => h.type === "CONSUME" || h.type === "PARTIAL_CONSUME");
                     const weightToRestore = consumeEvent ? (parseFloat(consumeEvent.deductedWeight) || 0) : 0;

                     if (weightToRestore > 0) {
                         batch.update(itemRef, {
                            status: "ACTIVE",
                            weight: (parseFloat(original.weight) || 0) + weightToRestore,
                            history: arrayUnion({
                               type: "RESTORE",
                               date: new Date().toISOString(),
                               restoredWeight: weightToRestore,
                               workDate: getTodayString(),
                               note: "소진 취소 및 복구"
                            })
                         });
                     }
                  }
               });
               await batch.commit();
               playSound("success");
            }
            setBulkActionTarget(null);
            setSelectedIds(new Set());
         } catch (e) { console.error(e); }
      };

         if (selectedIds.size === 0 || !bulkEditField || !val) return;
         const { db, updateDoc, doc } = window.__fb; const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
         const promises = Array.from(selectedIds).map(id => updateDoc(doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", id), { [bulkEditField]: val }) );
         await Promise.all(promises); setBulkEditField(null); setSelectedIds(new Set());

                let updatedHistory = original.history.map(h => ({...h}));

                if (itemUpdates.inboundDate !== undefined && itemUpdates.inboundDate !== original.inboundDate && updatedHistory.length > 0) {
                    if (updatedHistory[0].type === "INBOUND") {
                        const oldTime = updatedHistory[0].date && updatedHistory[0].date.length > 10 ? updatedHistory[0].date.substring(10) : "T00:00:00.000Z";
                        updatedHistory[0].date = itemUpdates.inboundDate + oldTime;
                        updatedHistory[0].workDate = itemUpdates.inboundDate;
                    }
                }

                if (itemUpdates.location !== undefined && itemUpdates.location !== original.location && updatedHistory.length > 0) {
                    const lastIdx = updatedHistory.length - 1;
                    updatedHistory[lastIdx].to = itemUpdates.location;
                    updatedHistory[lastIdx].location = itemUpdates.location;
                }

                if (itemUpdates.moveDate !== undefined && itemUpdates.moveDate !== original.moveDate && updatedHistory.length > 0) {
                    let lastMoveIdx = -1;
                    for (let i = updatedHistory.length - 1; i >= 0; i--) {
                        if (updatedHistory[i].type === "MOVE") { lastMoveIdx = i; break; }
                    }
                    if (lastMoveIdx !== -1) {
                        const oldTime = updatedHistory[lastMoveIdx].date && updatedHistory[lastMoveIdx].date.length > 10 ? updatedHistory[lastMoveIdx].date.substring(10) : "T00:00:00.000Z";
                        updatedHistory[lastMoveIdx].date = itemUpdates.moveDate + oldTime;
                        updatedHistory[lastMoveIdx].workDate = itemUpdates.moveDate;
                    }
                }

                itemUpdates.history = updatedHistory;
            }
            return updateDoc(doc(db, "artifacts", appId, "public", "data", "meat_wms_logs", id), itemUpdates);

          {bulkActionTarget && (

    // --- 3. Stats Screen ---
    function StatsScreen({ inventory, productionLogs }) {
       const [currentDate, setCurrentDate] = useState(new Date());
       const [viewMode, setViewMode] = useState("MONTH");
       const [isBriefingOpen, setIsBriefingOpen] = useState(false);
       const [briefingTitle, setBriefingTitle] = useState("✨ 경영 분석 리포트");
       const [briefingText, setBriefingText] = useState("");

       const moveDate = (dir) => { const d = new Date(currentDate); if (viewMode === "MONTH") d.setMonth(d.getMonth() + dir); else d.setFullYear(d.getFullYear() + dir); setCurrentDate(d); };
       const targetLabel = viewMode === "MONTH" ? `${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월` : `${currentDate.getFullYear()}년`;

       const filteredItems = useMemo(() => {
         return inventory.filter(item => {
            const dateStr = getSafeDate(item, 'inboundDate');
            if(!dateStr) return false;
            if (viewMode === "MONTH") { const targetMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}`; return dateStr.startsWith(targetMonth); }
            else { const targetYear = `${currentDate.getFullYear()}`; return dateStr.startsWith(targetYear); }
         });
       }, [inventory, currentDate, viewMode]);

       const filteredProduction = useMemo(() => {
          return productionLogs.filter(log => {
             const dateStr = log.processDate;
             if(!dateStr) return false;
             if (viewMode === "MONTH") { const targetMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}`; return dateStr.startsWith(targetMonth); }
             else { const targetYear = `${currentDate.getFullYear()}`; return dateStr.startsWith(targetYear); }
          });
       }, [productionLogs, currentDate, viewMode]);

       const stats = useMemo(() => {
         const totalInbound = filteredItems.filter(i => i.initialType === "INBOUND").reduce((a,b) => a + getOriginalInboundWeight(b), 0);
         const totalProduction = filteredProduction.reduce((a,b) => a + (parseFloat(b.weight)||0), 0); // 순생산량 합산
         const totalLoss = filteredProduction.reduce((a,b) => a + (parseFloat(b.dripLoss)||0) + (parseFloat(b.scrapLoss)||parseFloat(b.trimLoss)||0) + (parseFloat(b.wasteLoss)||parseFloat(b.prodLoss)||0), 0);
         return { totalInbound, totalProduction, totalLoss };
       }, [filteredItems, filteredProduction]);

       const chartData = (key, dataSrc = filteredItems, typeFilter = "INBOUND") => {
         const g = {};
         dataSrc.forEach(i => {
            if (typeFilter && i.initialType !== typeFilter && !i.cutType) return;
            const k = i[key] || "미지정"; if(!g[k]) g[k] = 0;
            g[k] += (typeFilter === "INBOUND") ? getOriginalInboundWeight(i) : (parseFloat(i.weight) || 0);
         });
         return Object.entries(g).map(([name, value]) => ({name, value})).sort((a,b)=>b.value-a.value).slice(0,5);
       };

       const handleStatsBriefing = async () => {
          if(filteredItems.length === 0 && filteredProduction.length === 0) return;
          setIsBriefingOpen(true);
          setBriefingTitle("✨ 경영 분석 리포트");
          setBriefingText("AI 분석중...");

          const topProducts = chartData('productName').map(d => `${d.name}(${d.value.toFixed(1)}kg)`).join(", ");
          const topProdProducts = chartData('productName', filteredProduction, null).map(d => `${d.name}(${d.value.toFixed(1)}kg)`).join(", ");

          const prompt = `입출고 및 생산 데이터를 바탕으로 경영 리포트를 작성해주세요. 기간: ${targetLabel}
          총 입고량: ${stats.totalInbound.toFixed(2)}kg, 총 순생산량: ${stats.totalProduction.toFixed(2)}kg, 총 발생 로스: ${stats.totalLoss.toFixed(2)}kg
          주요 입고품목: ${topProducts} | 주요 생산품목: ${topProdProducts}
          위 데이터를 바탕으로 수율(생산 효율) 및 트렌드를 분석하고 경영 제언을 한국어로 자연스럽게 작성해주세요. 마크다운 서식 제외.`;

          const text = await callGeminiText(prompt); setBriefingText(text);
       };

       const handlePurchaseAnalysis = async () => {
           setIsBriefingOpen(true);
           setBriefingTitle("🛒 AI 원육 발주 제안");
           setBriefingText("AI가 현재 가용 재고와 기간 내 소진율을 기반으로 발주량을 산출하고 있습니다...");

           const currentStockList = inventory.filter(i => i.status === "ACTIVE");
           const currentStockMap = {};
           currentStockList.forEach(i => {
               const p = i.productName || "기타";
               currentStockMap[p] = (currentStockMap[p] || 0) + (parseFloat(i.weight) || 0);
           });

           const prodMap = {};
           filteredProduction.forEach(p => {
               const name = p.productName || "기타";
               prodMap[name] = (prodMap[name] || 0) + (parseFloat(p.totalDeduction) || parseFloat(p.weight) || 0);
           });

           const stockStr = Object.entries(currentStockMap).map(([k, v]) => `${k}:${v.toFixed(1)}kg`).join(", ") || "재고없음";
           const prodStr = Object.entries(prodMap).map(([k, v]) => `${k}:${v.toFixed(1)}kg`).join(", ") || "생산내역없음";

           const prompt = `당신은 육류 가공 브랜드의 구매 관리자입니다.
분석 기간 기준: ${targetLabel}
현재 시스템 상 가용 재고 현황: ${stockStr}
해당 기간 내 부위별 총 소진량(순생산+로스 합계): ${prodStr}

위 데이터를 기반으로 다음 세 가지 항목을 분석하여 보고해주세요:
1. 각 부위별 재고 소진 속도 및 현재 재고 기준 예상 고갈 시점 추정 (재고 회전일수 분석)
2. 당장 원육 입고(발주)가 시급한 우선순위 품목 3가지
3. 품목별 적정 권장 발주량 (향후 2주~1달 치 버퍼 물량을 고려하여 구체적인 kg 단위 제안)
전문적이고 단호한 어조의 평문(마크다운 서식 제외)으로 한국어로 작성해주세요.`;

           const text = await callGeminiText(prompt);
           setBriefingText(text);
       };

       return (
         <div className="h-full flex flex-col bg-slate-50 p-4 overflow-y-auto pb-safe">
            <div className="flex justify-between items-center mb-6">
               <h2 className="text-xl font-bold text-slate-800">📈 경영 통계</h2>
               <div className="flex flex-col gap-2 items-end">
                  <div className="flex gap-2">
                     <button onClick={handlePurchaseAnalysis} className="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg font-bold text-xs border border-emerald-100 shadow-sm flex items-center gap-1">🛒 AI 발주 제안</button>
                     <button onClick={handleStatsBriefing} className="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg font-bold text-xs border border-indigo-100 shadow-sm flex items-center gap-1">✨ AI 분석</button>
                  </div>
                  <div className="bg-slate-200 rounded-lg p-1 flex text-xs font-bold w-fit">
                     <button onClick={()=>setViewMode("MONTH")} className={`px-3 py-1.5 rounded-md ${viewMode==="MONTH"?"bg-white shadow":""}`}>월별</button>
                     <button onClick={()=>setViewMode("YEAR")} className={`px-3 py-1.5 rounded-md ${viewMode==="YEAR"?"bg-white shadow":""}`}>연도별</button>
                  </div>
               </div>
            </div>

            <div className="flex items-center justify-center gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm">
               <button onClick={()=>moveDate(-1)} className="text-2xl text-slate-400 hover:text-indigo-600 font-bold">‹</button>
               <span className="text-lg font-black text-slate-800">{targetLabel}</span>
               <button onClick={()=>moveDate(1)} className="text-2xl text-slate-400 hover:text-indigo-600 font-bold">›</button>
            </div>

            <div className="grid grid-cols-2 gap-4 mb-4">
               <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                  <span className="text-sm font-bold text-slate-400 block mb-1">총 입고 중량</span>
                  <span className="text-2xl font-black text-indigo-600 tracking-tight">{stats.totalInbound.toFixed(2)}<span className="text-sm text-slate-300 ml-1">kg</span></span>
               </div>
               <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                  <span className="text-sm font-bold text-slate-400 block mb-1">총 순생산 중량</span>
                  <span className="text-2xl font-black text-slate-700 tracking-tight">{stats.totalProduction.toFixed(2)}<span className="text-sm text-slate-300 ml-1">kg</span></span>
                  {stats.totalLoss > 0 && <span className="block text-[10px] text-red-500 font-bold mt-1">로스 합계: {stats.totalLoss.toFixed(2)}kg</span>}
               </div>
            </div>

            <div className="grid grid-cols-1 gap-4">
               <BarChart data={chartData('productName', filteredProduction, null)} title="🔪 부위별 생산량 (Top 5)" color="orange" />
               <BarChart data={chartData('productName')} title="📦 부위별 입고량 (Top 5)" color="indigo" />
               <BarChart data={chartData('brand')} title="🏷 브랜드별 입고량 (Top 5)" color="green" />
            </div>

            {isBriefingOpen && (
               <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                  <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl animate-slide-up">
                     <h3 className="font-bold text-lg mb-2">{briefingTitle}</h3>
                     <div className="text-sm text-slate-600 mb-4 whitespace-pre-wrap leading-relaxed max-h-[60vh] overflow-y-auto">{briefingText}</div>
                     <button onClick={()=>setIsBriefingOpen(false)} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold">닫기</button>
                  </div>
               </div>
            )}
         </div>
       );
    }

    // --- 4. Settings Screen ---
    function SettingsScreen({ user, masterData, setMasterData }) {
      const [activeCat, setActiveCat] = useState("lossPresets");
      const [presetToDelete, setPresetToDelete] = useState(null); // V5.6 버그 수정: 모바일용 커스텀 삭제 모달 상태
      const [feedback, setFeedback] = useState(null);

      const CATS = [
        {k:"lossPresets", n:"로스 프리셋"},
        {k:"locations", n:"위치"}, {k:"productNames", n:"부위명"}, {k:"cutTypes", n:"컷팅형태"},
        {k:"factories", n:"공장번호"}, {k:"brands", n:"브랜드"}, {k:"grades", n:"등급"},
        {k:"origins", n:"원산지"}, {k:"suppliers", n:"거래처"}, {k:"returnDestinations", n:"반품처"}
      ];

      const [apiKeyInput, setApiKeyInput] = useState("");
      const [presetForm, setPresetForm] = useState({ productName: "", cutType: "", dripLoss: "", scrapLoss: "", wasteLoss: "" });

      useEffect(() => { setApiKeyInput(localStorage.getItem("meat_wms_api_key") || ""); }, []);
      const saveApiKey = () => { localStorage.setItem("meat_wms_api_key", apiKeyInput.trim()); setFeedback({type:"success", msg:"API 키가 저장되었습니다."}); setTimeout(()=>setFeedback(null),2000); };

      const updateMaster = async (newData) => {
          setMasterData(newData); const { db, doc, setDoc } = window.__fb; const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          await setDoc(doc(db, "artifacts", appId, "public", "data", "meat_wms_config", "master_data"), newData, {merge:true});
      };

      const addVal = (val) => { if(!val) return; const list = masterData[activeCat] || []; if(!list.includes(val)) updateMaster({...masterData, [activeCat]: [...list, val]}); };
      const delVal = (val) => { const list = masterData[activeCat] || []; updateMaster({...masterData, [activeCat]: list.filter(v=>v!==val)}); };

      // 로스 프리셋 전용 로직
      const handleSavePreset = () => {
          if (!presetForm.productName || !presetForm.cutType) {
              setFeedback({type:"error", msg:"부위명과 컷팅형태를 선택해주세요."});
              setTimeout(()=>setFeedback(null),2500);
              return;
          }

          const list = masterData.lossPresets || [];
          const index = list.findIndex(p => p.productName === presetForm.productName && p.cutType === presetForm.cutType);

          // V5.6 버그 수정: 문자열을 숫자로 변환하여 저장
          const newPreset = {
              productName: presetForm.productName,
              cutType: presetForm.cutType,
              dripLoss: presetForm.dripLoss !== "" ? parseFloat(presetForm.dripLoss) : 0,
              scrapLoss: presetForm.scrapLoss !== "" ? parseFloat(presetForm.scrapLoss) : 0,
              wasteLoss: presetForm.wasteLoss !== "" ? parseFloat(presetForm.wasteLoss) : 0,
          };

          let newList = [...list];
          if (index >= 0) newList[index] = newPreset;
          else newList.push(newPreset);

          updateMaster({ ...masterData, lossPresets: newList });
          setPresetForm({ productName: "", cutType: "", dripLoss: "", scrapLoss: "", wasteLoss: "" });
      };

      const executeDelPreset = () => {
          if(!presetToDelete) return;
          const list = masterData.lossPresets || [];
          updateMaster({ ...masterData, lossPresets: list.filter(p => !(p.productName === presetToDelete.productName && p.cutType === presetToDelete.cutType)) });
          setPresetToDelete(null);
      };

      return (
         <div className="h-full flex flex-col bg-white relative">
            {feedback && (
                <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none">
                <div className={`px-8 py-6 rounded-3xl shadow-2xl backdrop-blur-md flex flex-col items-center animate-slide-up ${feedback.type==="error"?"bg-red-500/90":"bg-slate-900/90"} text-white`}>
                    <span className="text-4xl mb-2">{feedback.type==="success" ? "✅" : "🚨"}</span>
                    <p className="text-xl font-bold text-center">{feedback.msg}</p>
                </div>
                </div>
            )}

            <div className="p-4 bg-slate-100 border-b">
                <h3 className="font-bold text-sm text-slate-600 mb-2">🔑 Google AI API 키 관리</h3>
                <div className="flex gap-2">
                    <input type="password" value={apiKeyInput} onChange={(e) => setApiKeyInput(e.target.value)} placeholder="AIza..." className="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none focus:border-indigo-500" />
                    <button onClick={saveApiKey} className="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-xs">저장</button>
                </div>
            </div>
            <div className="flex overflow-x-auto border-b no-scrollbar bg-slate-50">
               {CATS.map(c => (
                  <button key={c.k} onClick={()=>setActiveCat(c.k)} className={`px-4 py-3 text-sm font-bold whitespace-nowrap ${activeCat===c.k ? "text-indigo-600 border-b-2 border-indigo-600 bg-white" : "text-slate-400"}`}>{c.n}</button>
               ))}
            </div>

            {/* V5.6: 로스 프리셋 UI */}
            {activeCat === "lossPresets" ? (
                <div className="flex-1 overflow-y-auto p-4 bg-slate-50 pb-safe flex flex-col gap-4">
                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm flex flex-col gap-3">
                        <h4 className="font-bold text-indigo-800">새 프리셋 등록/수정</h4>
                        <div className="flex gap-2">
                            <div className="flex-1">
                                <span className="text-[10px] font-bold text-slate-400">부위명</span>
                                <select value={presetForm.productName} onChange={e=>setPresetForm({...presetForm, productName:e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-bold outline-none">
                                    <option value="">선택</option>
                                    {masterData.productNames.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                            <div className="flex-1">
                                <span className="text-[10px] font-bold text-slate-400">컷팅형태</span>
                                <select value={presetForm.cutType} onChange={e=>setPresetForm({...presetForm, cutType:e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-bold outline-none">
                                    <option value="">선택</option>
                                    {(masterData.cutTypes || []).map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <div className="flex-1">
                                <span className="text-[10px] font-bold text-slate-400">계량/해동 로스(투입량대비%)</span>
                                <input type="number" value={presetForm.dripLoss} onChange={e=>setPresetForm({...presetForm, dripLoss:e.target.value})} placeholder="0.0" className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-bold outline-none" />
                            </div>
                            <div className="flex-1">
                                <span className="text-[10px] font-bold text-slate-400">파지 로스(투입량대비%)</span>
                                <input type="number" value={presetForm.scrapLoss} onChange={e=>setPresetForm({...presetForm, scrapLoss:e.target.value})} placeholder="0.0" className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-bold outline-none text-orange-600" />
                            </div>
                            <div className="flex-1">
                                <span className="text-[10px] font-bold text-slate-400">폐기 로스(투입량대비%)</span>
                                <input type="number" value={presetForm.wasteLoss} onChange={e=>setPresetForm({...presetForm, wasteLoss:e.target.value})} placeholder="0.0" className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1.5 text-sm font-bold outline-none text-red-600" />
                            </div>
                        </div>
                        <button onClick={handleSavePreset} className="w-full py-2 bg-indigo-600 text-white rounded-lg font-bold text-sm shadow mt-1 hover:bg-indigo-700 transition-colors">저장하기</button>
                    </div>

                    <div className="flex flex-col gap-2">
                        <h4 className="font-bold text-sm text-slate-600 px-1">저장된 프리셋 목록</h4>
                        {(masterData.lossPresets || []).length === 0 && <div className="text-center py-6 text-slate-400 text-sm">저장된 내역이 없습니다.</div>}
                        {(masterData.lossPresets || []).map((p, idx) => (
                            <div key={idx}
                                 className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm cursor-pointer hover:bg-slate-50 transition-colors"
                                 onClick={() => setPresetForm({ // V5.6 버그 수정: 클릭 시 폼에 자동 채워넣어 UX 개선
                                    productName: p.productName,
                                    cutType: p.cutType,
                                    dripLoss: p.dripLoss !== undefined ? String(p.dripLoss) : "",
                                    scrapLoss: p.scrapLoss !== undefined ? String(p.scrapLoss) : "",
                                    wasteLoss: p.wasteLoss !== undefined ? String(p.wasteLoss) : ""
                                 })}>
                                <div>
                                    <div className="font-bold text-slate-800 text-sm">{p.productName} <span className="text-indigo-600 text-xs bg-indigo-50 px-1 py-0.5 rounded">{p.cutType}</span></div>
                                    <div className="text-xs text-slate-500 mt-1 flex gap-2">
                                        <span>해동: {p.dripLoss || 0}%</span>
                                        <span className="text-orange-500">파지: {p.scrapLoss || 0}%</span>
                                        <span className="text-red-500">폐기: {p.wasteLoss || 0}%</span>
                                    </div>
                                </div>
                                <button onClick={(e)=>{ e.stopPropagation(); setPresetToDelete({productName: p.productName, cutType: p.cutType}); }} className="bg-red-50 text-red-500 px-2 py-1 rounded text-xs font-bold hover:bg-red-100 transition-colors">삭제</button>
                            </div>
                        ))}
                    </div>

                    {/* V5.6 버그 수정: confirm 대체용 안전한 삭제 모달 */}
                    {presetToDelete && (
                        <div className="fixed inset-0 z-[99] bg-black/60 flex items-center justify-center p-4 animate-pulse-red">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl animate-fade-in text-center">
                            <div className="text-4xl mb-4">🗑</div>
                            <h3 className="font-bold text-lg text-slate-800 mb-2">프리셋을 삭제하시겠습니까?</h3>
                            <p className="text-sm text-slate-500 mb-6">[{presetToDelete.productName} - {presetToDelete.cutType}]</p>
                            <div className="flex gap-3">
                                <button onClick={()=>setPresetToDelete(null)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-600">취소</button>
                                <button onClick={executeDelPreset} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold shadow-lg shadow-red-200">삭제하기</button>
                            </div>
                            </div>
                        </div>
                    )}
                </div>
            ) : (
                <>
                    <div className="flex-1 overflow-y-auto p-4 bg-slate-50 pb-safe">
                        {(masterData[activeCat]||[]).map(v => (
                        <div key={v} className="bg-white p-3 mb-2 rounded-lg border border-slate-200 flex justify-between">
                            <span className="font-bold">{v}</span><button onClick={()=>delVal(v)} className="text-red-400 font-bold">✕</button>
                        </div>
                        ))}
                    </div>
                    <div className="p-4 border-t bg-white pb-safe">
                        <AddItem onAdd={addVal} placeholder={`${CATS.find(c=>c.k===activeCat).n} 추가`} />
                    </div>
                </>
            )}
         </div>
      );
    }

    // --- Components ---
    function EditModal({ data, masterData, onClose, onSave, isFullEdit }) {
       const [form, setForm] = useState(data); useEffect(() => { setForm(data); }, [data]);
       return (
         <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
             <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 animate-slide-up max-h-[90vh] overflow-y-auto">
                <h2 className="text-xl font-black mb-4">📝 정보 수정</h2>
                <div className="space-y-3">
                   <div className="grid grid-cols-2 gap-3">
                      <Select label="부위명" val={form.productName} opt={masterData.productNames} onChange={v=>setForm({...form, productName:v})} />
                      <Input label="중량(kg)" type="number" val={form.weight} onChange={v=>setForm({...form, weight:(parseFloat(v) || 0)})} />
                   </div>
                   <div className="grid grid-cols-2 gap-3">
                      <Select label="브랜드" val={form.brand} opt={masterData.brands} onChange={v=>setForm({...form, brand:v})} />
                      <Select label="원산지" val={form.origin} opt={masterData.origins} onChange={v=>setForm({...form, origin:v})} />
                   </div>
                   <div className="grid grid-cols-2 gap-3">
                      <Select label="등급" val={form.grade} opt={masterData.grades} onChange={v=>setForm({...form, grade:v})} />
                      <Select label="공장" val={form.factoryNo} opt={masterData.factories} onChange={v=>setForm({...form, factoryNo:v})} />
                   </div>
                   <div className="grid grid-cols-2 gap-3">
                      <Select label="위치" val={form.location} opt={masterData.locations} onChange={v=>setForm({...form, location:v})} />
                      <Input label="제조일자" type="date" val={form.packingDate} onChange={v=>setForm({...form, packingDate:v})} />
                   </div>
                   <div className="grid grid-cols-2 gap-3">
                      <Select label="거래처" val={form.supplier} opt={masterData.suppliers} onChange={v=>setForm({...form, supplier:v})} />
                      <Input label="단가" type="number" val={form.unitPrice} onChange={v=>setForm({...form, unitPrice:v})} />
                   </div>
                   <Input label="비고" val={form.userNote} onChange={v=>setForm({...form, userNote:v})} />
                   {isFullEdit && (
                       <div className="bg-slate-50 p-2 rounded mt-2 border border-slate-200">
                          <p className="text-xs font-bold text-slate-400 mb-2">관리자 전용 필드</p>
                          <div className="grid grid-cols-2 gap-2 mt-2">
                              <Input label="입고일자" type="date" val={form.inboundDate} onChange={v=>setForm({...form, inboundDate:v})} />
                              <Input label="이동일자" type="date" val={form.moveDate} onChange={v=>setForm({...form, moveDate:v})} />
                          </div>
                          <div className="mt-2">
                              <Input label="ID (Barcode/Manual)" val={form.barcode || form.id} onChange={v=>setForm({...form, barcode:v})} />
                          </div>
                       </div>
                   )}
                </div>
                <div className="mt-6 flex gap-2">
                   <button onClick={onClose} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-600">취소</button>
                   <button onClick={()=>onSave(form)} className="flex-1 py-3 bg-indigo-600 rounded-xl font-bold text-white shadow-lg">저장</button>
                </div>
             </div>
         </div>
       );
    }

    function PromptModal({ title, initialValue, onSave, onClose }) {
      const [value, setValue] = useState(initialValue || "");
      return (
        <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
          <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl animate-slide-up">
            <h3 className="font-bold text-lg mb-3 text-slate-800">{title}</h3>
            <input autoFocus className="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 mb-4" value={value} onChange={e => setValue(e.target.value)} onKeyDown={e => { if(e.key === 'Enter') onSave(value); }} />
            <div className="flex gap-2">
              <button onClick={onClose} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-500">취소</button>
              <button onClick={() => onSave(value)} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-200">확인</button>
            </div>
          </div>
        </div>
      );
    }

    function BarChart({ data, title, color="indigo" }) {
      if (!data || data.length === 0) return <div className="h-40 flex items-center justify-center text-slate-400 text-xs bg-white rounded-xl border">데이터 없음</div>;
      const maxVal = Math.max(...data.map(d => d.value)) || 1;
      const colors = { indigo: "bg-indigo-500", green: "bg-emerald-500", orange: "bg-orange-500", blue: "bg-blue-500" };
      return (
        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
          <h3 className="text-sm font-bold text-slate-600 mb-4">{title}</h3>
          <div className="h-40 flex items-end justify-between gap-2 px-2">
            {data.map((d, i) => (
              <div key={i} className="flex-1 flex flex-col items-center gap-1 group relative h-full justify-end">
                <div className={`w-full rounded-t-md transition-all relative flex justify-center group-hover:scale-105 ${colors[color]}`} style={{ height: `${(d.value / maxVal) * 80}%`, minHeight: '4px' }}>
                   <span className="absolute -top-5 text-[10px] font-bold text-slate-600">{d.value.toFixed(0)}</span>
                </div>
                <div className="text-[10px] text-slate-500 font-bold truncate w-full text-center border-t border-slate-100 pt-1">{d.name}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Select({ label, val, opt=[], onChange }) { return (<div className="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><div className="text-[10px] text-slate-400 font-bold">{label}</div><select value={val||""} onChange={e=>onChange(e.target.value)} className="bg-transparent w-full font-bold outline-none text-sm h-6"><option value="">선택</option>{opt.map(o=><option key={o} value={o}>{o}</option>)}</select></div>); }
    function ModeBtn({ label, active, onClick, color }) { const colors = { indigo: active ? "bg-white text-indigo-600 shadow ring-1 ring-black/5" : "text-slate-400", orange: active ? "bg-white text-orange-600 shadow ring-1 ring-black/5" : "text-slate-400", blue: active ? "bg-white text-blue-600 shadow ring-1 ring-black/5" : "text-slate-400" }; return <button onClick={onClick} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${colors[color]}`}>{label}</button>; }
    function SelectChip({ label, value, options=[], onChange, highlight, highlightRed }) { const base = "flex-shrink-0 flex flex-col border rounded-lg px-3 py-1.5 min-w-[100px]"; const style = highlight ? "bg-blue-50 border-blue-200" : highlightRed ? "bg-orange-50 border-orange-200" : "bg-slate-50 border-slate-200"; const textStyle = highlight ? "text-blue-500" : highlightRed ? "text-orange-500" : "text-slate-400"; return (<div className={`${base} ${style}`}><span className={`text-[10px] font-bold mb-0.5 ${textStyle}`}>{label}</span><select value={value} onChange={e=>onChange(e.target.value)} className="bg-transparent text-sm font-bold outline-none w-full"><option value="">선택</option>{options.map(o=><option key={o} value={o}>{o}</option>)}</select></div>); }
    function Toggle({ checked, onChange }) { return (<div onClick={()=>onChange(!checked)} className={`w-10 h-6 rounded-full p-1 cursor-pointer transition-colors ${checked?"bg-indigo-600":"bg-slate-300"}`}><div className={`w-4 h-4 bg-white rounded-full shadow-sm transition-transform ${checked?"translate-x-4":"translate-x-0"}`}></div></div>); }
    function Badge({ type }) { if(type==="RETURN") return <span className="bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded text-[10px] font-bold">반품</span>; if(type==="MOVE") return <span className="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-[10px] font-bold">이동</span>; if(type==="CONSUME") return <span className="bg-slate-700 text-white px-1.5 py-0.5 rounded text-[10px] font-bold">차감</span>; return <span className="bg-green-100 text-green-700 px-1.5 py-0.5 rounded text-[10px] font-bold">입고</span>; }
    function Input({ label, val, onChange, type="text" }) { return (<div className="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><div className="text-[10px] text-slate-400 font-bold">{label}</div><input type={type} value={val||""} onChange={e=>onChange(e.target.value)} className="bg-transparent w-full font-bold outline-none" /></div>); }
    function AddItem({ onAdd, placeholder }) { const [v, sV] = useState(""); return <div className="flex gap-2"><input value={v} onChange={e=>sV(e.target.value)} className="flex-1 bg-slate-100 rounded-lg px-3 outline-none" placeholder={placeholder} /><button onClick={()=>{onAdd(v);sV("")}} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">추가</button></div> }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MeatWMS_Pro_V4_36 />);
    </script>
</body>
</html>
